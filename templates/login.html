<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Keuangan Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card p-4 shadow-sm" style="width: 350px;">
        <h4 class="text-center mb-4 text-primary">Keuangan Sekolah</h4>
        
        {% if error %}
        <div class="alert alert-danger py-2 text-center" style="font-size: 0.85rem;">
            {{ error }}
        </div>
        {% endif %}

        <!-- ACTION DIUBAH KE '/' PERBAIKAN UTAMA -->
        <form action="/" method="POST">
            <div class="mb-3">
                <label class="form-label">Username (NUPTK / Peg.ID / NISN)</label>
                <input type="text" name="username" class="form-control" placeholder="Masukkan ID..." required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
        </form>
    </div>

</body>
</html>
