<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Keuangan ARROJA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card p-4 shadow-sm" style="width: 350px;">
        <h4 class="fw-bold text-primary mb-1">Keuangan ARROJA</h4>
        <p class="text-muted small mb-0">YPI ARROJA — MTs & MA Arroja Garut</p>
        
        {% if error %}
        <div class="alert alert-danger py-2 text-center" style="font-size: 0.85rem;">
            {{ error }}
        </div>
        {% endif %}

        <!-- ACTION DIUBAH KE '/' PERBAIKAN UTAMA -->
        <form action="/" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">NUPTK / Peg.ID / NISN</label>
                <input type="text" name="username" class="form-control" placeholder="Masukkan NUPTK, Peg.ID, atau NISN" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
        </form>
    </div>

</body>
</html>
